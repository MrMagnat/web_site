# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name andruafamil.ru www.andruafamil.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://andruafamil.ru$request_uri;
    }
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.andruafamil.ru;

    ssl_certificate /etc/letsencrypt/live/andruafamil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andruafamil.ru/privkey.pem;

    return 301 https://andruafamil.ru$request_uri;
}

# Main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name andruafamil.ru;

    ssl_certificate /etc/letsencrypt/live/andruafamil.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andruafamil.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Docker-резолвер + переменная upstream: nginx не падает, если контейнер
    # app поднимается чуть позже (резолвинг имени "app" происходит в рантайме,
    # а не при загрузке конфига). Это убирает "host not found in upstream app".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:3000;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Serve uploaded product images directly via Nginx (no Node.js overhead)
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;

        # Разрешаем картинки И видео (hero-видео приветственного экрана)
        location ~* \.(jpg|jpeg|png|webp|gif|svg|avif|mp4|webm|mov|ogg)$ {
            expires 30d;
        }
        location ~ {
            return 403;
        }
    }

    # Static Next.js assets — long cache
    location /_next/static/ {
        proxy_pass http://$app_upstream;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API rate limiting
    location /api/admin/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Загрузка больших файлов (видео): стримим и даём больше времени
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # General app
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
