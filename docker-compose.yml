version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: andrua_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andrua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-andrua_famil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andrua} -d ${POSTGRES_DB:-andrua_famil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andrua_app
    restart: unless-stopped
    # Все переменные (ENCRYPTION_KEY, ADMIN_*, NEXTAUTH_*, RESEND_* и т.д.)
    # подтягиваются из .env.production. ENCRYPTION_KEY обязателен — им
    # шифруются секреты (ключи Ozon) в базе. Без него работа с Ozon сломается.
    env_file:
      - .env.production
    environment:
      # DATABASE_URL переопределяем на внутренний хост compose-сети (postgres),
      # значение из .env.production здесь не используется.
      DATABASE_URL: postgresql://${POSTGRES_USER:-andrua}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-andrua_famil}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - external

  nginx:
    image: nginx:1.25-alpine
    container_name: andrua_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - external

volumes:
  postgres_data:
  uploads:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
